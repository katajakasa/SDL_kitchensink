name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
  repository_dispatch:
    types: [ run_build ]

jobs:
  compile:
    name: Compile with ${{ matrix.config.name }}
    runs-on: ubuntu-26.04
    env:
      CC: ${{ matrix.config.cc }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "gcc 13",   cc: gcc-13 }
          - { name: "gcc 14",   cc: gcc-14 }
          - { name: "gcc 15",   cc: gcc-15 }
          - { name: "clang 18", cc: clang-18 }
          - { name: "clang 19", cc: clang-19 }
          - { name: "clang 20", cc: clang-20 }

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install libsdl2-dev libavcodec-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev libass-dev clang-tidy ${{ matrix.config.cc }} \
            libcmocka-dev

      - name: Build
        run: |
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DUSE_TIDY=1 -DBUILD_EXAMPLES=1 -DBUILD_TESTS=1 -DKIT_FAULT_INJECTION=1 ..
          make -j2

  test:
    name: ${{ matrix.config.name }}
    runs-on: ubuntu-26.04
    env:
      CC: ${{ matrix.config.cc }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "Release build + tests"
            cc: gcc-15
            cmake_flags: "-DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=1 -DBUILD_TESTS=1"
            test_env: ""
          - name: "Release build + tests (dynamic libass)"
            cc: gcc-15
            cmake_flags: "-DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=1 -DUSE_DYNAMIC_LIBASS=1"
            test_env: ""
          - name: "ASan debug build + tests"
            cc: clang-20
            cmake_flags: "-DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=1 -DUSE_ASAN=1 -DKIT_FAULT_INJECTION=1"
            test_env: "LSAN_OPTIONS=suppressions=${GITHUB_WORKSPACE}/tests/common/lsan.supp"
          - name: "TSan debug build + tests"
            cc: clang-20
            cmake_flags: "-DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=1 -DUSE_TSAN=1 -DKIT_FAULT_INJECTION=1"
            test_env: "TSAN_OPTIONS=suppressions=${GITHUB_WORKSPACE}/tests/common/tsan.supp"

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install libsdl2-dev libavcodec-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev libass-dev ${{ matrix.config.cc }} libcmocka-dev

      - name: Build
        run: |
          mkdir build && cd build
          cmake ${{ matrix.config.cmake_flags }} ..
          make -j2

      - name: Test
        run: |
          cd build
          env ${{ matrix.config.test_env }} ctest --output-on-failure
